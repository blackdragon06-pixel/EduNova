<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduNova MCQ 🧠</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,"Noto Sans Sinhala",sans-serif;
}

:root{
    --bg:#f5f7ff;
    --card:#ffffff;
    --text:#172033;
    --muted:#747c90;
    --primary:#6958e8;
    --primary2:#8b5cf6;
    --border:#e6e9f2;
    --soft:#eef0ff;
    --green:#10b981;
    --red:#ef4444;
    --orange:#f59e0b;
}

body.dark{
    --bg:#0d1120;
    --card:#171c2d;
    --text:#f4f5ff;
    --muted:#9ca5ba;
    --border:#292f42;
    --soft:#202641;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.3s;
}

/* HEADER */

header{
    height:72px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
}

.logo{
    width:42px;
    height:42px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.header-right{
    display:flex;
    gap:9px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    cursor:pointer;
    font-size:18px;
}

/* MAIN */

main{
    width:92%;
    max-width:850px;
    margin:30px auto 60px;
}

/* TOP */

.top{
    text-align:center;
    margin-bottom:25px;
}

.top h1{
    font-size:29px;
    margin-bottom:7px;
}

.top p{
    color:var(--muted);
    font-size:14px;
}

/* SELECT */

.select-area{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:20px;
    box-shadow:0 15px 40px rgba(40,45,80,.08);
    margin-bottom:20px;
}

.select-area h3{
    margin-bottom:14px;
}

.subject-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.subject-btn{
    padding:13px 5px;
    border-radius:13px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.subject-btn:hover,
.subject-btn.selected{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    border-color:transparent;
}

/* DIFFICULTY */

.difficulty{
    display:flex;
    gap:9px;
    margin-top:15px;
}

.diff-btn{
    flex:1;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    padding:10px;
    border-radius:11px;
    cursor:pointer;
}

.diff-btn.selected{
    background:var(--soft);
    color:var(--primary);
    border-color:var(--primary);
    font-weight:bold;
}

/* START */

.start-btn{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* QUIZ */

.quiz{
    display:none;
}

.quiz-top{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:17px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.question-count{
    color:var(--muted);
    font-size:13px;
}

.timer{
    background:var(--soft);
    color:var(--primary);
    padding:9px 13px;
    border-radius:11px;
    font-weight:bold;
}

.question-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:23px;
    padding:25px;
    box-shadow:0 15px 45px rgba(40,45,80,.08);
}

.badge{
    display:inline-block;
    background:var(--soft);
    color:var(--primary);
    padding:7px 11px;
    border-radius:9px;
    font-size:12px;
    margin-bottom:15px;
}

.question{
    font-size:20px;
    line-height:1.7;
    margin-bottom:20px;
}

.options{
    display:grid;
    gap:11px;
}

.option{
    width:100%;
    text-align:left;
    padding:15px;
    border-radius:14px;
    border:2px solid var(--border);
    background:var(--bg);
    color:var(--text);
    cursor:pointer;
    transition:.2s;
    font-size:15px;
}

.option:hover{
    border-color:var(--primary);
}

.option.correct{
    border-color:var(--green);
    background:rgba(16,185,129,.10);
}

.option.wrong{
    border-color:var(--red);
    background:rgba(239,68,68,.10);
}

.option.disabled{
    cursor:not-allowed;
}

/* EXPLANATION */

.explanation{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:14px;
    background:var(--soft);
    line-height:1.7;
    font-size:14px;
}

.next-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:14px;
    background:var(--primary);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* RESULT */

.result{
    display:none;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 15px 45px rgba(40,45,80,.10);
}

.result-icon{
    font-size:65px;
    margin-bottom:10px;
}

.result h2{
    font-size:26px;
    margin-bottom:8px;
}

.result p{
    color:var(--muted);
    line-height:1.6;
}

.result-score{
    font-size:43px;
    font-weight:bold;
    color:var(--primary);
    margin:20px 0;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:20px 0;
}

.result-box{
    background:var(--bg);
    border-radius:15px;
    padding:15px 5px;
}

.result-box strong{
    display:block;
    font-size:21px;
}

.result-box span{
    color:var(--muted);
    font-size:12px;
}

.retry{
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:650px){

    main{
        width:94%;
    }

    .subject-buttons{
        grid-template-columns:repeat(2,1fr);
    }

    .question-card{
        padding:19px;
    }

    .question{
        font-size:17px;
    }

    .result-grid{
        grid-template-columns:1fr 1fr 1fr;
    }

}

</style>
</head>

<body>

<header>

    <div class="brand">
        <div class="logo">🧠</div>
        <span>EduNova MCQ</span>
    </div>

    <div class="header-right">

        <button
            class="icon-btn"
            onclick="toggleDark()"
            id="themeBtn">
            🌙
        </button>

        <button
            class="icon-btn"
            onclick="goHome()">
            🏠
        </button>

    </div>

</header>


<main>

<!-- ================= START SCREEN ================= -->

<div id="startScreen">

    <div class="top">

        <h1>🧠 MCQ Challenge</h1>

        <p>
            ඔයාගේ දැනුම test කරලා
            XP සහ Level ලබාගන්න! 🚀
        </p>

    </div>


    <div class="select-area">

        <h3>📚 Subject එක තෝරන්න</h3>

        <div class="subject-buttons">

            <button
                class="subject-btn selected"
                onclick="selectSubject('Mathematics',this)">
                🔢 Maths
            </button>

            <button
                class="subject-btn"
                onclick="selectSubject('Biology',this)">
                🧬 Biology
            </button>

            <button
                class="subject-btn"
                onclick="selectSubject('Physics',this)">
                ⚡ Physics
            </button>

            <button
                class="subject-btn"
                onclick="selectSubject('Chemistry',this)">
                🧪 Chemistry
            </button>

        </div>


        <h3 style="margin-top:20px;">
            🎯 Difficulty එක
        </h3>

        <div class="difficulty">

            <button
                class="diff-btn selected"
                onclick="selectDifficulty('Easy',this)">
                🟢 Easy
            </button>

            <button
                class="diff-btn"
                onclick="selectDifficulty('Medium',this)">
                🟡 Medium
            </button>

            <button
                class="diff-btn"
                onclick="selectDifficulty('Hard',this)">
                🔴 Hard
            </button>

        </div>


        <button
            class="start-btn"
            onclick="startQuiz()">
            🚀 MCQ Test එක පටන් ගන්න
        </button>

    </div>

</div>


<!-- ================= QUIZ ================= -->

<div id="quizScreen" class="quiz">

    <div class="quiz-top">

        <div>
            <strong id="quizSubject">
                Mathematics
            </strong>

            <div class="question-count">
                ප්‍රශ්නය
                <span id="currentNumber">1</span>
                /
                <span id="totalNumber">10</span>
            </div>
        </div>

        <div class="timer">
            ⏱️ <span id="timer">30</span>s
        </div>

    </div>


    <div class="question-card">

        <div class="badge" id="difficultyBadge">
            🟢 Easy
        </div>

        <div
            class="question"
            id="question">
        </div>

        <div
            class="options"
            id="options">
        </div>

        <div
            class="explanation"
            id="explanation">
        </div>

        <button
            class="next-btn"
            id="nextBtn"
            style="display:none"
            onclick="nextQuestion()">
            ඊළඟ ප්‍රශ්නය →
        </button>

    </div>

</div>


<!-- ================= RESULT ================= -->

<div id="resultScreen" class="result">

    <div class="result-icon" id="resultIcon">
        🏆
    </div>

    <h2 id="resultTitle">
        Excellent!
    </h2>

    <p id="resultMessage">
        ඔයා හොඳට කරලා තියෙනවා!
    </p>

    <div class="result-score">
        <span id="finalScore">0</span>%
    </div>


    <div class="result-grid">

        <div class="result-box">
            <strong id="correctAnswers">0</strong>
            <span>නිවැරදි</span>
        </div>

        <div class="result-box">
            <strong id="wrongAnswers">0</strong>
            <span>වැරදි</span>
        </div>

        <div class="result-box">
            <strong id="earnedXP">0</strong>
            <span>ලැබුණු XP</span>
        </div>

    </div>


    <div
        style="
        background:var(--soft);
        padding:17px;
        border-radius:15px;
        margin-bottom:18px;
        ">

        🧠 ඔයාගේ Level

        <strong
            id="finalLevel"
            style="
            display:block;
            font-size:22px;
            color:var(--primary);
            margin-top:5px;
            ">
            Beginner 🌱
        </strong>

    </div>


    <button
        class="retry"
        onclick="restartQuiz()">
        🔄 නැවත Test කරන්න
    </button>

</div>

</main>
